{% extends "base.html" %}

{% block title %}Registrar Nuevo Activo{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/ios-wizard.css') }}">
<style>
    /* Estilos adicionales para mejorar la apariencia del wizard */
    .wizard-form-group {
        margin-bottom: 1.5rem;
    }
    .wizard-form-group label {
        display: block;
        font-weight: 600;
        color: var(--ios-secondary-label-color);
        margin-bottom: 0.5rem;
    }
    .form-control-wizard {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1.5px solid var(--ios-separator-color);
        background-color: var(--ios-tertiary-system-fill-color);
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-control-wizard:focus {
        outline: none;
        border-color: var(--ios-blue);
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    }
    .wizard-summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
    }
    .summary-section {
        background-color: var(--ios-tertiary-system-fill-color);
        padding: 1rem;
        border-radius: 12px;
    }
    .summary-section h5 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--ios-label-color);
        border-bottom: 1px solid var(--ios-separator-color);
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
    }
    .summary-item {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
    }
    .summary-item .label {
        color: var(--ios-secondary-label-color);
    }
    .summary-item .value {
        font-weight: 500;
        color: var(--ios-label-color);
        text-align: right;
    }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
    <!-- Contenedor donde se renderizará el wizard -->
    <div id="add-activo-wizard"></div>

    <!-- Datos para el wizard -->
    <div id="wizard-data"
         data-atributos-por-clase="{{ atributos_por_clase|tojson|safe }}"
         data-clases="{{ clases|tojson|safe }}"
         data-funcionarios="{{ funcionarios|tojson|safe }}"
         data-csrf-token="{{ csrf_token() }}">
    </div>

    <!-- Formulario real que se enviará al final -->
    <form id="real-form" action="{{ url_for('activos.add_activo') }}" method="POST" enctype="multipart/form-data" style="display: none;"></form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/ios-wizard.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const wizardDataEl = document.getElementById('wizard-data');
        const atributosPorClase = JSON.parse(wizardDataEl.dataset.atributosPorClase);
        const clases = JSON.parse(wizardDataEl.dataset.clases);
        const funcionarios = JSON.parse(wizardDataEl.dataset.funcionarios);
        const csrfToken = wizardDataEl.dataset.csrfToken;

        /**
         * Escapa caracteres HTML para prevenir XSS.
         * @param {string} str - La cadena de texto a sanear.
         * @returns {string} La cadena saneada.
         */
        const escapeHTML = (str) => {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, (match) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[match]));
        };

        // --- Definición de los pasos del Wizard ---
        const wizardConfig = {
            steps: [
                {
                title: 'Información Básica',
                subtitle: 'Identifica el activo y su tipo de propiedad.',
                render: renderStep1,
                validate: (stepEl) => {
                    const nombre = stepEl.querySelector('[name="nombre_activo"]').value;
                    const placa = stepEl.querySelector('[name="placa_codigo_interno"]').value;
                    const tipo = stepEl.querySelector('[name="tipo_propiedad"]').value;
                    if (!nombre || !placa || !tipo) {
                        return { valid: false, message: 'Por favor, completa todos los campos obligatorios.' };
                    }
                    return { valid: true };
                }
                },
                {
                title: 'Detalles y Clasificación',
                subtitle: 'Especifica marca, modelo, serie y clasifica el activo.',
                render: renderStep2,
                validate: (stepEl) => {
                    const claseId = stepEl.querySelector('[name="clase_id"]').value;
                    if (!claseId) {
                        return { valid: false, message: 'Debes seleccionar una Clase de Activo.' };
                    }
                    return { valid: true };
                }
                },
                {
                title: 'Ubicación y Estado',
                subtitle: 'Asigna una ubicación y un responsable inicial.',
                render: renderStep3
                },
                {
                title: 'Confirmación',
                subtitle: 'Revisa los datos antes de registrar el activo.',
                render: () => `<div id="wizard-summary-content" class="wizard-summary"></div>`
                }
            ]
        };

        // --- Inicialización del Wizard ---
        const wizard = new iOSWizard(wizardConfig.steps.map(s => ({ ...s, content: s.render() })), {
            containerId: 'add-activo-wizard',
            onComplete: (data) => {
                // Mueve los datos al formulario real y lo envía
                const realForm = document.getElementById('real-form');
                realForm.innerHTML = ''; // Limpiar por si acaso

                // Agregar el token CSRF, esencial para la seguridad del formulario
                const csrfTokenInput = document.createElement('input');
                csrfTokenInput.type = 'hidden';
                csrfTokenInput.name = 'csrf_token';
                csrfTokenInput.value = csrfToken;
                realForm.appendChild(csrfTokenInput);

                for (const key in data) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = data[key];
                    realForm.appendChild(input);
                }
                wizard.showToast('Registrando activo...', 'info');
                realForm.submit();
            },
            onStepChange: (stepIndex, step, data) => {
                // Lógica para ejecutar en cada cambio de paso
                if (step.title === 'Detalles y Clasificación') {
                    const claseSelect = document.getElementById('clase_id');
                    claseSelect.addEventListener('change', (e) => renderDynamicAttributes(e.target.value));
                    renderDynamicAttributes(claseSelect.value);
                }
                if (step.title === 'Confirmación') {
                    renderSummary(data);
                }
            }
        });

        // --- Funciones de Renderizado de Pasos ---

        function renderStep1() {
            return `
                <div class="wizard-form-group">
                    <label for="nombre_activo">Nombre del Activo *</label>
                    <input type="text" id="nombre_activo" name="nombre_activo" class="form-control-wizard" required placeholder="Ej: Monitor de Signos Vitales">
                </div>
                <div class="wizard-form-group">
                    <label for="placa_codigo_interno">Placa / Código Interno *</label>
                    <input type="text" id="placa_codigo_interno" name="placa_codigo_interno" class="form-control-wizard" required placeholder="Ej: BIO-001">
                </div>
                <div class="wizard-form-group">
                    <label for="tipo_propiedad">Tipo de Propiedad *</label>
                    <select id="tipo_propiedad" name="tipo_propiedad" class="form-control-wizard" required>
                        <option value="">Seleccione...</option>
                        <option value="Propio">Propio</option>
                        <option value="Ajeno">Ajeno</option>
                    </select>
                </div>
            `;
        }

        function renderStep2() {
            const clasesOptions = clases.map(clase => `<option value="${escapeHTML(clase.id)}">${escapeHTML(clase.nombre_clase)}</option>`).join('');
            return `
                <div class="row">
                    <div class="col-md-6 wizard-form-group">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" name="marca" class="form-control-wizard" placeholder="Ej: Dell, Mindray">
                    </div>
                    <div class="col-md-6 wizard-form-group">
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" name="modelo" class="form-control-wizard" placeholder="Ej: Latitude 5420">
                    </div>
                </div>
                <div class="wizard-form-group">
                    <label for="serie">Número de Serie</label>
                    <input type="text" id="serie" name="serie" class="form-control-wizard" placeholder="Ej: ABC123XYZ">
                </div>
                <div class="wizard-form-group">
                    <label for="clase_id">Clase de Activo *</label>
                    <select id="clase_id" name="clase_id" class="form-control-wizard" required>
                        <option value="">Seleccione una clase...</option>
                        ${clasesOptions}
                    </select>
                </div>
                <div id="dynamic-attributes-container"></div>
            `;
        }

        function renderStep3() {
            const funcionariosOptions = funcionarios.map(func => `<option value="${escapeHTML(func.id)}">${escapeHTML(func.nombres)} ${escapeHTML(func.apellidos)}</option>`).join('');
            return `
                <div class="wizard-form-group">
                    <label for="ubicacion">Ubicación Inicial</label>
                    <input type="text" id="ubicacion" name="ubicacion" class="form-control-wizard" placeholder="Ej: Almacén, Piso 3 - UCI">
                </div>
                <div class="wizard-form-group">
                    <label for="estado">Estado Inicial</label>
                    <select id="estado" name="estado" class="form-control-wizard">
                        <option value="Operativo">Operativo</option>
                        <option value="Pendiente Asignación">Pendiente Asignación</option>
                        <option value="En Mantenimiento">En Mantenimiento</option>
                        <option value="Fuera de Servicio">Fuera de Servicio</option>
                    </select>
                </div>
                <div class="wizard-form-group">
                    <label for="funcionario_id">Responsable (Opcional)</label>
                    <select id="funcionario_id" name="funcionario_id" class="form-control-wizard">
                        <option value="">Sin asignar</option>
                        ${funcionariosOptions}
                    </select>
                </div>
            `;
        }

        function renderDynamicAttributes(claseId) {
            const container = document.getElementById('dynamic-attributes-container');
            container.innerHTML = '';
            const attributes = atributosPorClase[claseId];
            if (!attributes) return;

            let html = '<hr class="my-4"><h5 class="mb-3">Atributos Específicos</h5>';
            attributes.forEach(attr => {
                html += `<div class="wizard-form-group">
                            <label for="${escapeHTML(attr.name)}">${escapeHTML(attr.label)} ${attr.required ? '*' : ''}</label>`;
                if (attr.type === 'select') {
                    html += `<select id="${escapeHTML(attr.name)}" name="${escapeHTML(attr.name)}" class="form-control-wizard" ${attr.required ? 'required' : ''}>
                                <option value="">Seleccione...</option>
                                ${attr.options.map(opt => `<option value="${escapeHTML(opt)}">${escapeHTML(opt)}</option>`).join('')}
                             </select>`;
                } else {
                    html += `<input type="${escapeHTML(attr.type || 'text')}" id="${escapeHTML(attr.name)}" name="${escapeHTML(attr.name)}" class="form-control-wizard"
                                   placeholder="${escapeHTML(attr.placeholder || '')}" ${attr.required ? 'required' : ''}>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function renderSummary(data) {
            const summaryContainer = document.getElementById('wizard-summary-content');
            const claseId = data.clase_id;
            const claseSeleccionada = document.querySelector(`#clase_id option[value="${claseId}"]`);
            const nombreClase = claseSeleccionada ? escapeHTML(claseSeleccionada.textContent) : 'N/A';

            let summaryHtml = `
                <div class="wizard-summary-grid">
                    <div class="summary-section">
                        <h5>Información Principal</h5>
                        <div class="summary-item"><span class="label">Nombre:</span> <span class="value">${escapeHTML(data.nombre_activo || 'N/A')}</span></div>
                        <div class="summary-item"><span class="label">Placa:</span> <span class="value">${escapeHTML(data.placa_codigo_interno || 'N/A')}</span></div>
                        <div class="summary-item"><span class="label">Tipo:</span> <span class="value">${escapeHTML(data.tipo_propiedad || 'N/A')}</span></div>
                    </div>
                    <div class="summary-section">
                        <h5>Detalles Técnicos</h5>
                        <div class="summary-item"><span class="label">Marca:</span> <span class="value">${escapeHTML(data.marca || 'N/A')}</span></div>
                        <div class="summary-item"><span class="label">Modelo:</span> <span class="value">${escapeHTML(data.modelo || 'N/A')}</span></div>
                        <div class="summary-item"><span class="label">Serie:</span> <span class="value">${escapeHTML(data.serie || 'N/A')}</span></div>
                        <div class="summary-item"><span class="label">Clase:</span> <span class="value">${escapeHTML(nombreClase)}</span></div>
                    </div>
                    <div class="summary-section">
                        <h5>Ubicación y Estado</h5>
                        <div class="summary-item"><span class="label">Ubicación:</span> <span class="value">${escapeHTML(data.ubicacion || 'N/A')}</span></div>
                        <div class="summary-item"><span class="label">Estado:</span> <span class="value">${escapeHTML(data.estado || 'N/A')}</span></div>
                    </div>
                </div>
            `;

            // Resumen de atributos dinámicos
            const dynamicAttrs = atributosPorClase[claseId];
            if (dynamicAttrs && dynamicAttrs.length > 0) {
                summaryHtml += `<div class="summary-section mt-4">
                                    <h5>Atributos de ${escapeHTML(nombreClase)}</h5>`;
                dynamicAttrs.forEach(attr => {
                    if (data[attr.name]) {
                        summaryHtml += `<div class="summary-item"><span class="label">${escapeHTML(attr.label)}:</span> <span class="value">${escapeHTML(data[attr.name])}</span></div>`;
                    }
                });
                summaryHtml += `</div>`;
            }

            summaryContainer.innerHTML = summaryHtml;
        }
    });
</script>
{% endblock %}
