{% extends "base.html" %}

{% block title %}
    {{ 'Editar Activo' if modo_edicion else 'Agregar Nuevo Activo' }}
{% endblock %}

{% block head_extra %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/wizard-clean.css') }}">
{% endblock %}


{% block content %}

    <div
        id="asset-wizard-root"
        data-mode="{% if modo_edicion %}edit{% else %}create{% endif %}"
        {% if modo_edicion and datos_activo_json %}
        data-asset-json='{{ datos_activo_json | safe }}'
        {% endif %}
    ></div>
{% endblock %}

{% block scripts %}
    <!--
      El wizard se compila con Vite (ver carpeta frontend/) y se sirve ya
      empaquetado junto con React. Antes se descargaba el .jsx y se transpilaba
      en el navegador con Babel Standalone, lo que añadía ~3 MB de descarga,
      retrasaba el primer render y dependía de dos CDN externos.

      Para reconstruirlo tras editar frontend/src:
          cd frontend && npm run build
    -->
    <script type="module" src="{{ static_v('dist/wizard-activos.js') }}"></script>
{% endblock %}
