{% extends "base.html" %}
{% block title %}Añadir Proveedor{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h3 text-center mb-4">
                        <i class="bi bi-plus-circle-fill me-2"></i>Añadir Nuevo Proveedor
                    </h2>
                    
                    <form method="POST" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="razon_social" class="form-label">Razón Social <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="razon_social" name="razon_social" required>
                            </div>
                            <div class="col-md-6">
                                <label for="nit" class="form-label">NIT</label>
                                <input type="text" class="form-control" id="nit" name="nit">
                            </div>
                            <div class="col-md-6">
                                <label for="numero_contacto" class="form-label">Teléfono de Contacto</label>
                                <input type="text" class="form-control" id="numero_contacto" name="numero_contacto">
                            </div>
                            <div class="col-12">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" name="direccion">
                            </div>
                            <div class="col-12">
                                <label for="persona_contacto" class="form-label">Persona de Contacto</label>
                                <input type="text" class="form-control" id="persona_contacto" name="persona_contacto">
                            </div>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-end">
                            <a href="{{ url_for('proveedores.ver_proveedores') }}" class="btn btn-secondary me-3">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle-fill me-2"></i>Guardar Proveedor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
