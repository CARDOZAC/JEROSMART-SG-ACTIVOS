<div id="seccion-traslado" class="details-form">
  <h4 class="mb-3">Detalles del Acta de Traslado</h4>

  <div class="row g-3">
    <div class="col-12">
      <h5 class="fs-6 fw-bold">Tipo de traslado</h5>
      <div class="row">
        <div class="col-md-6">
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_tipo" value="Retiro de funcionario" id="tt1"><label class="form-check-label" for="tt1">Retiro de funcionario</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_tipo" value="Activo de un funcionario a otro en la misma área" id="tt2"><label class="form-check-label" for="tt2">Activo de un funcionario a otro en la misma área</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_tipo" value="Activo de un centro de costo a otro" id="tt3"><label class="form-check-label" for="tt3">Activo de un centro de costo a otro</label></div>
        </div>
        <div class="col-md-6">
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_tipo" value="Traslado de bodega por obsolescencia, desuso o reposición" id="tt4"><label class="form-check-label" for="tt4">Traslado de bodega por obsolescencia, desuso o reposición</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_tipo" value="Traslado de un activo de bodega a centro de costo" id="tt5"><label class="form-check-label" for="tt5">Traslado de un activo de bodega a centro de costo</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_tipo" value="Traslado del activo de un tercero" id="tt6"><label class="form-check-label" for="tt6">Traslado del activo de un tercero</label></div>
        </div>
      </div>
    </div>

    <div class="col-12 mt-3">
      <h5 class="fs-6 fw-bold">Características del traslado</h5>
      <div class="row">
        <div class="col-md-6">
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_caracteristicas" value="Salida de activos" id="tc1"><label class="form-check-label" for="tc1">Salida de activos</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_caracteristicas" value="Activo Ajeno" id="tc2"><label class="form-check-label" for="tc2">Activo Ajeno</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_caracteristicas" value="Asignación permanente de activo" id="tc3"><label class="form-check-label" for="tc3">Asignación permanente de activo</label></div>
        </div>
        <div class="col-md-6">
          <div class="form-check"><input class="form-check-input" type="checkbox" name="traslado_caracteristicas" value="Asignación temporal del activo" id="tc4"><label class="form-check-label" for="tc4">Asignación temporal del activo</label></div>
          <label class="form-label mt-2">Lugar o evento de destino:</label>
          <input type="text" name="traslado_lugar_destino" class="form-control form-control-sm">
        </div>
      </div>
    </div>

    <div class="col-12 mt-3"><h5 class="fs-6 fw-bold">Especificaciones de Ubicación</h5></div>
    <div class="col-md-6"><label class="form-label">Ubicación Inicial</label><input type="text" name="traslado_ubicacion_inicial" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Ubicación Final</label><input type="text" name="traslado_ubicacion_final" class="form-control"></div>

    <div class="col-12 mt-3"><h5 class="fs-6 fw-bold">Responsable Origen (Quién Entrega)</h5></div>
    <div class="col-md-6">
      <label class="form-label">Nombre Completo</label>
      <input type="text" name="origen_responsable_nombre" id="origen_responsable_nombre" class="form-control" placeholder="Nombre del responsable actual">
    </div>
    <div class="col-md-6">
      <label class="form-label">Cédula</label>
      <input type="text" name="origen_responsable_cc" id="origen_responsable_cc" class="form-control" placeholder="Cédula">
    </div>
    <div class="col-md-6">
      <label class="form-label">Cargo</label>
      <input type="text" name="origen_responsable_cargo" id="origen_responsable_cargo" class="form-control" placeholder="Cargo">
    </div>
    <div class="col-md-6">
      <label class="form-label">Área</label>
      <input type="text" name="origen_responsable_area" id="origen_responsable_area" class="form-control" placeholder="Área o Servicio">
    </div>
    <div class="col-md-6">
      <label class="form-label">Código de Costo</label>
      <input type="text" name="origen_codigo_costo" class="form-control" placeholder="Código">
    </div>
    <div class="col-md-6">
      <label class="form-label">Centro de Costo</label>
      <input type="text" name="origen_centro_costo" class="form-control" placeholder="Centro de Costo">
    </div>

    <div class="col-12 mt-3"><h5 class="fs-6 fw-bold">Responsable Destino (Quién Recibe)</h5></div>
    <div class="col-md-6">
      <label class="form-label">Nombre Completo</label>
      <input type="text" name="nuevo_responsable_nombre" id="nuevo_responsable_nombre" class="form-control" placeholder="Buscar nuevo responsable">
    </div>
    <div class="col-md-6">
      <label class="form-label">Cédula</label>
      <input type="text" name="nuevo_responsable_cc" id="nuevo_responsable_cc" class="form-control" placeholder="Cédula">
    </div>
    <div class="col-md-6">
      <label class="form-label">Cargo</label>
      <input type="text" name="nuevo_responsable_cargo" id="nuevo_responsable_cargo" class="form-control" placeholder="Cargo">
    </div>
    <div class="col-md-6">
      <label class="form-label">Área</label>
      <input type="text" name="nuevo_responsable_area" id="nuevo_responsable_area" class="form-control" placeholder="Área o Servicio">
    </div>
    <div class="col-md-6">
      <label class="form-label">Código de Costo</label>
      <input type="text" name="nuevo_codigo_costo" class="form-control" placeholder="Código">
    </div>
    <div class="col-md-6">
      <label class="form-label">Centro de Costo</label>
      <input type="text" name="nuevo_centro_costo" class="form-control" placeholder="Centro de Costo">
    </div>

    <div class="col-12 mt-3">
      <label class="form-label">Estado del Activo</label>
      <select name="estado_activo" class="form-select">
        <option value="">Seleccione...</option>
        <option value="Bueno">Bueno</option>
        <option value="Regular">Regular</option>
        <option value="Malo">Malo</option>
        <option value="Fuera de Servicio">Fuera de Servicio</option>
      </select>
    </div>

    <div class="col-12 mt-3">
      <label class="form-label">Observaciones</label>
      <textarea name="observaciones_generales" class="form-control" rows="2"></textarea>
    </div>
  </div>
</div>
